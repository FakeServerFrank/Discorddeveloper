name: Build debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Inyectar URL del backend
        working-directory: app
        env: { APP_URL: "${{ vars.APP_URL || secrets.APP_URL }}" }
        run: |
          test -n "$APP_URL" || { echo "Falta la variable APP_URL"; exit 1; }
          sed -i "s|__APP_URL__|$APP_URL|" capacitor.config.json
      - name: Instalar y generar proyecto Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Compilar APK debug
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en una release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Nexus APK (última versión)
          files: app/android/app/build/outputs/apk/debug/app-debug.apk